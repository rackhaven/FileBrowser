name: Release

# Tag-driven release: git tag v1.0.0 && git push origin v1.0.0 builds static
# binaries for every platform, publishes a GitHub release with checksums, and
# pushes the container image to ghcr under the same tag. Nothing runs off
# pushes to main; the trigger is the tag only.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the release and attach files
  packages: write   # push the image to ghcr

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Same gates as CI, run again at the tag: a tag's binaries must come
      # from a tree that passes the suite.
      - name: Tests, vet and formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -count=1 ./...

      - name: Build for every target
        run: |
          set -eux
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            out="dist/filebrowser-${target//\//-}"
            if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" ./cmd/filebrowser
            unset GOOS GOARCH
          done
          ls -lh dist/

      - name: Checksums
        run: cd dist && sha256sum filebrowser-* > checksums-sha256.txt && ls

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "filebrowser $GITHUB_REF_NAME" \
            --generate-notes

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr wants the whole path lower-case.
      - name: Image name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The runtime stage's package commands run on each target, so arm64
      # needs emulation even though the binaries cross-compile natively.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile builds and tests the same tree itself, so the image
      # is never assembled from a tree that failed the suite. The suite
      # runs once (it targets the builder) and both platforms reuse that
      # pass; only the build step differs per platform.
      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
