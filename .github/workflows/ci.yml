name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Run as a non-root user: the file browser must work on files owned by
      # someone else, and the tests should not depend on root's extra powers.
      - name: Unit tests under the race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check the PWA assets agree with each other
        run: node tools/check-wiring.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build for every target
        run: |
          set -eux
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" \
              -o "dist/filebrowser-${target//\//-}" ./cmd/filebrowser
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-binaries
          path: dist/

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image (tests run again inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: filebrowser:ci
          build-args: |
            VERSION=ci-${{ github.sha }}

      - name: Smoke test the container
        run: |
          set -eux
          docker run -d --name fb -p 8080:8080 \
            -e FB_ADMIN_USER=admin -e FB_ADMIN_PASSWORD=ci-test-password \
            filebrowser:ci

          # The health endpoint is what the Docker HEALTHCHECK uses.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/api/status

          # The shell must be served so the sign-in form can render.
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>'

          # Unauthenticated API access must be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:8080/api/fs/list?path=/')
          test "$code" = "401"

          docker logs fb
          docker rm -f fb

      - name: Image size
        run: docker images filebrowser:ci --format '{{.Size}}'
