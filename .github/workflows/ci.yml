name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Run as a non-root user: the file browser must work on files owned by
      # someone else, and the tests should not depend on root's extra powers.
      - name: Unit tests under the race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check the PWA assets agree with each other
        run: node tools/check-wiring.mjs

  # A short fuzz run on two of the riskiest pure functions: the joiner that
  # builds every path and the resolver behind the containment checks. The
  # corpus from CI lands in the build cache, so each push explores a little
  # further than the last; a real fuzzing campaign still belongs on a
  # workstation, this only proves the suite runs and seeds keep passing.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Fuzz the path joiner
        # One retry around both fuzz steps: the engine occasionally warns
        # out of a run with a bare "context deadline exceeded", no crash
        # input and no minimized case, once the corpus runs deep enough
        # to keep a worker busy at the wind-down. A re-run of the same
        # job on this very commit went green. A genuinely failing input
        # cannot hide behind that: go's fuzzer minimizes it and pins it
        # into testdata, where the ordinary test suite fails on it
        # before either attempt matters.
        run: |
          set -u
          attempts=0
          until go test ./internal/fs -run '^$' -fuzz '^FuzzJoin$' -fuzztime 30s; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 2 ]; then
              echo "fuzz the path joiner: both attempts failed"
              exit 1
            fi
            echo "first attempt failed; retrying once"
          done

      - name: Fuzz the path resolver
        run: |
          set -u
          attempts=0
          until go test ./internal/fs -run '^$' -fuzz '^FuzzResolve$' -fuzztime 30s; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 2 ]; then
              echo "fuzz the path resolver: both attempts failed"
              exit 1
            fi
            echo "first attempt failed; retrying once"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build for every target
        run: |
          set -eux
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" \
              -o "dist/filebrowser-${target//\//-}" ./cmd/filebrowser
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: filebrowser-binaries
          path: dist/

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the image (tests run again inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: filebrowser:ci
          build-args: |
            VERSION=ci-${{ github.sha }}

      - name: Smoke test the container
        run: |
          set -eux
          docker run -d --name fb -p 8080:8080 \
            -e FB_ADMIN_USER=admin -e FB_ADMIN_PASSWORD=ci-test-password \
            filebrowser:ci

          # The health endpoint is what the Docker HEALTHCHECK uses.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done

          # One script now serves as the deploy smoke test and this, so a new
          # check has to pass here before it reaches an operator; the two had
          # been drifting, with inline checks here and deeper ones there.
          FB_ADMIN_PASSWORD=ci-test-password ./deploy/smoke-test.sh http://127.0.0.1:8080

          docker logs fb
          docker rm -f fb

      - name: Image size
        run: docker images filebrowser:ci --format '{{.Size}}'

      # Releases publish arm64 too. The build stage cross-compiles on the
      # runner, so a slip there (a missing ARG TARGETARCH, say) would still
      # build cleanly and ship an amd64 binary in an arm64 image. Running the
      # binary under emulation is what catches that before a tag does.
      - uses: docker/setup-qemu-action@v4

      - name: Build the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          tags: filebrowser:ci-arm64
          build-args: |
            VERSION=ci-${{ github.sha }}

      - name: Run the arm64 binary
        run: docker run --rm --platform linux/arm64 filebrowser:ci-arm64 version
